[project]
name = "code-intent"
version = "1.0.0"
description = "Evidence-backed software decision investigations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.35,<1",
  "google-genai==2.34.0",
  "neo4j-graphrag==1.23.0",
  "pydriller==2.12",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "procrastinate>=3,<4",
  "tree-sitter-language-pack==1.20.0",
  "tree-sitter==0.25.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
