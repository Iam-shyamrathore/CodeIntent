[project]
name = "code-intent"
version = "1.0.0"
description = "Dependency-upgrade impact analysis for GitHub pull requests, with a Neo4j code graph and MCP tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.35,<1",
  "google-genai==2.34.0",
  "neo4j-graphrag==1.23.0",
  "pydriller==2.12",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "procrastinate>=3,<4",
  "tree-sitter-language-pack==1.20.0",
  "tree-sitter==0.25.2",
  "packaging==26.3",
  "pip-requirements-parser==32.0.1",
  "poetry-core==2.5.0",
  "libcst==1.9.0",
  "griffelib==2.4.1",
  "pyjwt[crypto]==2.15.1",
  "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I",  # pycodestyle, pyflakes, import order
  "UP",                # modern syntax for the target Python
  "B",                 # bugbear: likely bugs and design problems
  "C4",                # comprehensions
  "SIM",               # simplifications
  "PIE", "RET",        # redundant code, consistent returns
  "PERF",              # performance anti-patterns
  "PTH",               # pathlib over os.path
  "LOG", "G",          # logging: lazy formatting, correct logger use
  "PT",                # pytest style
  "ISC",               # implicit string concatenation
  "T20",               # no print() in library code
  "S110", "S112",      # no silent try/except/pass or continue
  "RUF",               # ruff-specific checks
]
# Line length is owned by `ruff format`; manual loops are kept where they read more clearly.
ignore = ["E501", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]  # command-line tools report on stdout
# Its GraphQL text is full of braces that str.format or an f-string would need escaped.
"scripts/sample_harmless.py" = ["T201", "UP031"]
# These tests assert what a context manager records when its body raises, so the body is the subject.
"tests/{test_runs,test_storage_integration}.py" = ["PT012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in parameter defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]
