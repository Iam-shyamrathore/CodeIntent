# Weekly dependency updates. A 7-day cooldown keeps brand-new releases (the window in which most
# compromised packages are caught and yanked) out of update PRs; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # Major versions need a deliberate migration; security updates are raised regardless.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # Major versions need a deliberate migration; security updates are raised regardless.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
