name: Validate
on: [push, pull_request]
# Read-only token: CI only checks out code; nothing here writes to the repository.
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: codeintent, POSTGRES_DB: codeintent, POSTGRES_PASSWORD: integration-password}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U codeintent" --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env: {NEO4J_AUTH: 'neo4j/integration-password'}
        ports: ['7687:7687']
        options: --health-cmd "wget -q --spider http://localhost:7474" --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://codeintent:integration-password@localhost:5432/codeintent
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: integration-password
      CODEINTENT_API_SECRET: integration-service-secret
      CODEINTENT_OPERATOR_TOKEN: integration-operator-secret
      CODEINTENT_RUN_INTEGRATION: '1'
      # Engine tests read real releases from PyPI and history from GitHub with the read-only job token.
      CODEINTENT_RUN_NETWORK: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: {version: '0.12.2'}
      - run: uv sync --locked
      # Fail on any known vulnerability (OSV / PyPI advisory database) in the locked runtime dependencies.
      - run: |
          uv export --format requirements-txt --no-dev --no-emit-project --frozen -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off
      - run: uv run ruff check codeintent scripts tests
      - run: uv run ruff format --check codeintent scripts tests
      - run: uv run pytest -q
