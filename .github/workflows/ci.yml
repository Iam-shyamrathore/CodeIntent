name: Validate
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: codeintent, POSTGRES_DB: codeintent, POSTGRES_PASSWORD: integration-password}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U codeintent' --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env: {NEO4J_AUTH: 'neo4j/integration-password'}
        ports: ['7687:7687']
        options: --health-cmd 'wget -q --spider http://localhost:7474' --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://codeintent:integration-password@localhost:5432/codeintent
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: integration-password
      CODEINTENT_API_SECRET: integration-service-secret
      CODEINTENT_OPERATOR_TOKEN: integration-operator-secret
      CODEINTENT_RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.2'}
      - run: uv sync --locked
      - run: uv run ruff check codeintent scripts tests
      - run: uv run ruff format --check codeintent scripts tests
      - run: uv run pytest -q
