# For a service-account JSON instead of GOOGLE_API_KEY / attached cloud identity.
services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/vertex.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?Set an absolute JSON path}:/run/vertex.json:ro
  worker:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/vertex.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?Set an absolute JSON path}:/run/vertex.json:ro
